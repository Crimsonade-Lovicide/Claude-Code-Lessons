# Starter-kit settings, read by the hooks. Leave a value empty to use auto-detection.

# Command the Stop hook runs before Claude may finish, from the repo root.
# Empty: run the "test" script of each package.json near the changed files,
# or pytest for Python projects. Example: KIT_TEST_CMD="npm --prefix web test"
KIT_TEST_CMD="bash tests/run.sh"

# Formatter run after each edit. {file} becomes the edited file's path.
# Empty: the project's own Prettier, or ruff for .py files, when installed.
# Example: KIT_FORMAT_CMD="npx biome format --write {file}"
KIT_FORMAT_CMD=""

# 1 = block finishing while tests fail. 0 = turn the Stop gate off.
KIT_STOP_GATE=1
